name: E2E Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HIVE_REPO: hivelms/Hive
  HIVE_REF: feature/sso

jobs:
  e2e:
    name: Full E2E Tests (with Hive SSO)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # GitHub-hosted ubuntu-24.04 runners ship with ~14GB free, which isn't
      # enough headroom for building/caching Hive's full docker-compose stack
      # (14 images, including a from-source nginx build) on top of the Next.js
      # build + Playwright browsers. Reclaim the preinstalled toolchains we
      # don't use (.NET, Android SDK, GHC, CodeQL) before anything else runs.
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          echo "Disk space after cleanup:"
          df -h /

      # ── Hive (SSO identity provider + organizational data) ────────────
      # Checkout Hive from the private hivelms/Hive repository using a PAT.
      - name: Verify Hive checkout token and SSO branch
        env:
          HIVE_CHECKOUT_TOKEN: ${{ secrets.CLASSIC_ACCESS_TOKEN || secrets.HIVE_REPO_TOKEN }}
        run: |
          if [ -z "$HIVE_CHECKOUT_TOKEN" ]; then
            echo "::error::No Hive checkout token configured. Add CLASSIC_ACCESS_TOKEN or HIVE_REPO_TOKEN (PAT with read access to hivelms/Hive) under Settings → Secrets and variables → Actions."
            exit 1
          fi
          repo_code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${HIVE_CHECKOUT_TOKEN}" \
            "https://api.github.com/repos/${HIVE_REPO}")
          if [ "$repo_code" = "401" ]; then
            echo "::error::The Hive checkout token is invalid, expired, or revoked (HTTP 401). Generate a new PAT and update the secret."
            exit 1
          fi
          if [ "$repo_code" != "200" ]; then
            echo "::error::The token cannot read ${HIVE_REPO} (HTTP $repo_code). Check: classic PAT has the 'repo' scope; the hivelms org allows classic PATs (or SSO-authorize the token for the org); a fine-grained PAT must be approved by the hivelms org admins."
            exit 1
          fi
          branch_code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${HIVE_CHECKOUT_TOKEN}" \
            "https://api.github.com/repos/${HIVE_REPO}/branches/${HIVE_REF}")
          if [ "$branch_code" != "200" ]; then
            echo "::error::The token can read ${HIVE_REPO}, but branch '${HIVE_REF}' was not found (HTTP $branch_code)."
            exit 1
          fi
          echo "Hive token OK — repository and branch '${HIVE_REF}' are reachable."

      - name: Checkout Hive (SSO branch)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.HIVE_REPO }}
          ref: ${{ env.HIVE_REF }}
          token: ${{ secrets.CLASSIC_ACCESS_TOKEN || secrets.HIVE_REPO_TOKEN }}
          path: hive
          filter: blob:limit=50k
          persist-credentials: false

      - name: Map local hostnames
        run: |
          echo "127.0.0.1 hive.org" | sudo tee -a /etc/hosts
          echo "127.0.0.3 madash.bis" | sudo tee -a /etc/hosts

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve Hive commit
        id: hive_sha
        working-directory: hive
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache Hive prod images
        id: hive_images_cache
        uses: actions/cache@v6
        with:
          path: /tmp/hive-images.tar
          key: hive-prod-images-v1-${{ steps.hive_sha.outputs.sha }}

      - name: Load cached Hive images
        if: steps.hive_images_cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/hive-images.tar

      - name: Build & Initialize Hive
        working-directory: hive
        env:
          HIVE_CACHE_HIT: ${{ steps.hive_images_cache.outputs.cache-hit }}
        run: |
          cat > .env.override <<'EOF'
          HIVE_CORE_WORKERS=2
          HIVE_CORE_THREADS=2
          HIVE_NGINX_WORKERS=1
          EOF
          compose="docker compose -f docker-compose.yaml"

          if [ "$HIVE_CACHE_HIT" = "true" ]; then
            echo "Reusing cached Hive images — skipping build."
          else
            echo "No Hive image cache — building from source."
            python3 manage_hive.py build_deps
            $compose build
          fi

          $compose up -d
          $compose exec -T core python manage.py migrate
          $compose exec -T core python manage.py collectstatic --noinput
          $compose exec -T database sh /update.sh
          $compose exec -T core python manage.py service_accounts
          $compose exec -T core python manage.py load_tags
          $compose exec -T \
            -e DJANGO_SUPERUSER_USERNAME=admin \
            -e DJANGO_SUPERUSER_PASSWORD=Password1 \
            -e DJANGO_SUPERUSER_EMAIL=admin@hive.org \
            core python manage.py createsuperuser --noinput
          $compose exec -T core python manage.py load_programs

          if [ "$HIVE_CACHE_HIT" != "true" ]; then
            imgs=$(docker images 'hive/*' --format '{{.Repository}}:{{.Tag}}' | grep -v -- '-base' || true)
            if [ -n "$imgs" ]; then
              # Build cache/dangling layers from compiling nginx/frontend/core from
              # source aren't needed once the final images exist, and `docker save`
              # below needs roughly another full copy's worth of disk for the tar —
              # reclaim what we can first so that doesn't run us out of space.
              docker builder prune -af || true
              echo "Disk space before saving Hive image cache:"
              df -h /
              echo "Saving Hive images for cache:"; echo "$imgs"
              docker save -o /tmp/hive-images.tar $imgs
            fi
          fi

      - name: Wait for Hive
        run: |
          for i in $(seq 1 90); do
            code=$(curl -ks -o /dev/null -w "%{http_code}" https://hive.org/ || true)
            if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
              echo "Hive is up (HTTP $code)"
              exit 0
            fi
            echo "Attempt $i/90 - Hive not ready yet (HTTP $code), waiting 5s..."
            sleep 5
          done
          echo "::error::Hive failed to become ready in time"
          exit 1

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Verify Hive admin login via pyhive
        run: |
          python - <<'PY'
          from pyhive import HiveClient

          with HiveClient("admin", "Password1", "https://hive.org", verify=False, timeout=30) as client:
              print("Hive admin login OK. API version:", client.get_hive_version())
          PY

      # ── Madash environment & local stack ──────────────────────────────
      - name: Generate self-signed SSL certificates
        run: |
          mkdir -p ssl
          openssl req -x509 -newkey rsa:4096 -keyout ssl/key.pem \
            -out ssl/cert.pem -sha256 -days 30 -nodes -subj "/CN=madash.bis"

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright chromium browser
        run: npx playwright install chromium --with-deps

      - name: Register SSO and generate .env
        run: python scripts/ci_setup.py

      - name: Build Next.js app
        run: npm run build

      - name: Start WebSocket session server
        run: npm run session:start &

      - name: Start Next.js server
        run: npm run start &

      - name: Start Nginx proxy
        run: |
          MADASH_PROXY_BIND_IP=127.0.0.3 docker compose -f deploy/docker-compose.local.yml up proxy -d

      - name: Wait for Madash to be ready
        run: |
          for i in $(seq 1 90); do
            code=$(curl -ks -o /dev/null -w "%{http_code}" https://madash.bis/ || true)
            if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
              echo "Madash is up (HTTP $code)"
              exit 0
            fi
            echo "Attempt $i/90 - Madash not ready yet (HTTP $code), waiting 5s..."
            sleep 5
          done
          echo "::error::Madash failed to become ready in time"
          exit 1

      # ── Run Playwright tests ──────────────────────────────────────────
      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          CI: true

      # ── Artifacts ──────────────────────────────────────────────────────
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Results
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Dump Container Logs
        if: failure()
        run: |
          mkdir -p container-logs
          docker ps -a
          for c in $(docker ps -aq); do
            name=$(docker inspect --format '{{.Name}}' "$c" | tr -d '/')
            docker logs "$c" > "container-logs/$name.log" 2>&1 || true
          done
          # Dump proxy logs to stdout for quick diagnosis
          echo "::group::Proxy logs"
          docker logs proxy-local || true
          echo "::endgroup::"

      - name: Upload Container Logs
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: container-logs
          path: container-logs/
          retention-days: 7
