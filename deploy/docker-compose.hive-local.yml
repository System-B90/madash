# Madash — overlay for running Madash and Hive on the SAME machine.
#
# With Hive on another host nothing here is needed: NEXT_PUBLIC_HIVE_URL points
# at Hive's real hostname and ordinary DNS does the rest. This overlay is for
# the co-located case (dev boxes, single-machine installs), where Madash's
# containers must reach a Hive stack on the same Docker daemon.
#
# Usage (docker:dev already includes it):
#   docker compose -f docker-compose.yml -f docker-compose.hive-local.yml up -d
#
# Why an alias on Hive's nginx rather than extra_hosts on ours: `hive.org:
# host-gateway` does not reach Hive when its nginx is bound to a specific
# loopback address on the host. Joining Hive's network and letting Docker's
# embedded DNS resolve a container alias has no dependency on host bind
# addresses or the host hosts file. The alias lives on Hive's container, so it
# cannot be declared here; scripts/link-hive.sh adds it idempotently:
#
#   docker network connect --alias hive.org <hive-net> <hive-nginx-container>

services:
  ui:
    networks:
      - madash_net
      - hive_net
    # The base file pins hive.org to the host gateway. /etc/hosts beats DNS, so
    # clear it and let hive_net's alias win.
    extra_hosts: !reset []

  proxy:
    networks:
      - madash_net
      - hive_net

networks:
  hive_net:
    # Compose names Hive's network after the directory it was started from, so
    # it differs by environment: hive-stack_hive-net locally, hive_hive-net in
    # CI. scripts/link-hive.sh detects it; override with HIVE_NETWORK_NAME.
    name: ${HIVE_NETWORK_NAME:-hive-stack_hive-net}
    external: true
