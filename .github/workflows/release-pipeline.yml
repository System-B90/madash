name: Build and Release Madash

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_UI: system-b15/madash/fe
  IMAGE_NAME_WS: system-b15/madash/ws
  IMAGE_NAME_PROXY: system-b15/madash/proxy

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies (Node)
        run: npm ci

      - name: Install Dependencies (Python)
        run: pip install ruff

      - name: Run ESLint
        run: npm run lint

      - name: Run Ruff (Python Linter)
        run: ruff check .

      - name: Run Ruff (Python Formatter Check)
        run: ruff format --check .

  test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:unit

  build-and-push:
    name: Docker Build and Push
    needs: [lint, test]
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Frontend (UI) Image ---
      - name: Extract metadata for UI Image
        id: meta-ui
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_UI }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push UI Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          build-args: |
            WEBSOCKET_SESSION_SERVER_SENDER_AUTH_KEY=ci_build_placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- WebSocket Image ---
      - name: Extract metadata for WS Image
        id: meta-ws
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WS }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push WebSocket Image
        uses: docker/build-push-action@v7
        with:
          context: session-server/
          file: session-server/Dockerfile.websocket
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta-ws.outputs.tags }}
          labels: ${{ steps.meta-ws.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Proxy Image ---
      - name: Extract metadata for Proxy Image
        id: meta-proxy
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROXY }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push Proxy Image
        uses: docker/build-push-action@v7
        with:
          context: nginx/
          file: nginx/Dockerfile.proxy
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  craft-release:
    name: Craft Release Packages
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Workspace
        run: |
          mkdir -p release-online/images
          mkdir -p release-offline/images

          # Copy deployment scripts into both bundles
          cp scripts/install.sh deploy/docker-compose.yml scripts/setup.py scripts/requirements.txt release-online/
          cp scripts/install.sh deploy/docker-compose.yml scripts/setup.py scripts/requirements.txt release-offline/

      - name: Export Offline Images
        run: |
          TAG_NAME=${{ github.ref_name }}

          echo "Pulling freshly built images..."
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_UI }}:$TAG_NAME
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WS }}:$TAG_NAME
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROXY }}:$TAG_NAME

          echo "Saving images to flat archives..."
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_UI }}:$TAG_NAME -o release-offline/images/madash-fe.tar
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WS }}:$TAG_NAME -o release-offline/images/madash-ws.tar
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROXY }}:$TAG_NAME -o release-offline/images/madash-proxy.tar

      - name: Compress Final Packages
        run: |
          tar -czvf madash-online-${{ github.ref_name }}.tar.gz -C release-online .
          tar -czvf madash-offline-${{ github.ref_name }}.tar.gz -C release-offline .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            madash-online-${{ github.ref_name }}.tar.gz
            madash-offline-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
