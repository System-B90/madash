name: madash

services:
  fe:
    environment:
      - NODE_ENV=development
    develop:
      watch:
        - action: sync
          path: ../
          target: /app/
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ../package.json

  ws:
    environment:
      - NODE_ENV=development
    develop:
      watch:
        - action: sync
          path: ../session-server
          target: /app/
          ignore:
            - node_modules/
        - action: rebuild
          path: ../session-server/package.json
