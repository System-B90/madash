name: Build and Release Madash

on:
  # push is master-only on purpose. With `push: ["**"]` alongside
  # `pull_request: ["**"]`, every commit on a PR branch ran this workflow
  # twice — once per event — and the two runs did not cancel each other,
  # because the concurrency key includes github.ref, which is
  # refs/heads/<branch> for push and refs/pull/N/merge for pull_request.
  # Two checkouts, two `npm ci` runs and two test runs per commit, on a
  # single shared self-hosted box.
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_UI: system-b90/madash/ui
  IMAGE_NAME_SESSIONS: system-b90/madash/sessions
  IMAGE_NAME_PROXY: system-b90/madash/proxy

jobs:
  lint:
    name: Lint Codebase
    runs-on: [self-hosted, node, python]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          # No `cache:` on purpose. The self-hosted runners have persistent
          # disk, so the npm cache already survives between runs — the
          # actions/cache save is pure cost, and it is what left a
          # peek-a-boo job wedged in "Post Setup Node.js" for over an hour
          # while holding the runner. bluz dropped it for the same reason.

      - name: Setup Python
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # actions/setup-python ignores the runner's own Python (the `py` launcher)
      # and downloads a zip whose setup.ps1 Windows PowerShell 5.1 blocks under
      # the runner's execution policy. Use the installed 3.11 in a per-job venv.
      - name: Setup Python (self-hosted)
        if: runner.environment != 'github-hosted'
        shell: pwsh
        run: |
          py -V:3.11 -m venv "$env:RUNNER_TEMP\venv"
          if ($LASTEXITCODE -ne 0) { throw "py -V:3.11 -m venv failed" }
          "$env:RUNNER_TEMP\venv\Scripts" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Dependencies (Node)
        run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      # Was `pip install ruff`. The requirements file now carries the
      # Python test deps too, and pulls sb90-devops from the org pip index
      # (GitHub Pages) — tools_impl.py imports it, so pytest cannot collect
      # without it.
      - name: Install Dependencies (Python)
        run: pip install -r scripts/requirements.txt

      - name: Run ESLint
        run: npm run lint

      - name: Run Ruff (Python Linter)
        run: ruff check .

      - name: Run Ruff (Python Formatter Check)
        run: ruff format --check .

      # Runs here rather than in the `test` job because that one is labelled
      # [self-hosted, node] with no Python toolchain, and this job already has
      # one set up.
      - name: Run Python Unit Tests
        run: pytest -q

  test:
    name: Unit Tests
    runs-on: [self-hosted, node]
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          # No `cache:` on purpose. The self-hosted runners have persistent
          # disk, so the npm cache already survives between runs — the
          # actions/cache save is pure cost, and it is what left a
          # peek-a-boo job wedged in "Post Setup Node.js" for over an hour
          # while holding the runner. bluz dropped it for the same reason.

      - name: Install Dependencies
        run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      - name: Run Unit Tests
        run: npm run test:unit

  build-and-push:
    name: Docker Build and Push
    needs: [lint, test]
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, dind]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Frontend (UI) Image ---
      - name: Extract metadata for UI Image
        id: meta-ui
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_UI }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push UI Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          build-args: |
            WEBSOCKET_SESSION_SERVER_SENDER_AUTH_KEY=ci_build_placeholder
          secrets: |
            npm_token=${{ secrets.ACCESS_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- WebSocket Image ---
      - name: Extract metadata for WS Image
        id: meta-sessions
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SESSIONS }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push WebSocket Image
        uses: docker/build-push-action@v7
        with:
          context: session-server/
          file: session-server/Dockerfile.websocket
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta-sessions.outputs.tags }}
          labels: ${{ steps.meta-sessions.outputs.labels }}
          secrets: |
            npm_token=${{ secrets.ACCESS_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Proxy Image ---
      - name: Extract metadata for Proxy Image
        id: meta-proxy
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROXY }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push Proxy Image
        uses: docker/build-push-action@v7
        with:
          context: nginx/
          file: nginx/Dockerfile.proxy
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  craft-release:
    name: Craft Release Packages
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, dind]
    timeout-minutes: 45
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Shared with Bluz and peek-a-boo via sb90-deploy, driven by
      # deploy/app.json. This used to ship deploy/docker-compose.yml — the dev
      # file, which builds from ../ and reads ../.env — as the bundle's compose
      # file, with no VERSION, update or link-hive; the bundles now carry
      # docker-compose.release.yml and the full install/update/link-hive set.
      - name: Craft release bundles
        uses: System-B90/.github/actions/craft-release@main
        with:
          tag: ${{ github.ref_name }}
          out: .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            madash-online-${{ github.ref_name }}.tar.gz
            madash-offline-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
