name: madash

services:
  ui:
    image: ghcr.io/system-b90/madash/ui:${MADASH_VERSION:-latest}
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        NPM_TOKEN: ${NPM_TOKEN}
    container_name: madash-ui
    restart: unless-stopped
    env_file:
      - ../.env
    extra_hosts:
      - "hive.org:host-gateway"
    networks:
      - madash_net
    depends_on:
      sessions:
        condition: service_healthy
    healthcheck:
      # No curl/wget in the runner image; node is the only HTTP client.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  sessions:
    image: ghcr.io/system-b90/madash/sessions:${MADASH_VERSION:-latest}
    build:
      context: ../session-server
      dockerfile: Dockerfile.websocket
      args:
        NPM_TOKEN: ${NPM_TOKEN}
    container_name: madash-sessions
    restart: unless-stopped
    env_file:
      - ../.env
    networks:
      - madash_net
    healthcheck:
      # Pure WebSocket server — no HTTP route to probe, so accepting a TCP
      # connection on the listen port is the readiness signal.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(28199,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  proxy:
    image: ghcr.io/system-b90/madash/proxy:${MADASH_VERSION:-latest}
    build:
      context: ../nginx
      dockerfile: Dockerfile.proxy
    container_name: madash-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../ssl:/etc/nginx/ssl:ro
    depends_on:
      ui:
        condition: service_healthy
      sessions:
        condition: service_healthy
    networks:
      - madash_net

networks:
  madash_net:
    driver: bridge
