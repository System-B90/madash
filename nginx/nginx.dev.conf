# Dev-stack proxy config (mounted by deploy/docker-compose.dev.yml).
#
# Differs from nginx.conf in one way that matters for hot-reload: upstreams are
# resolved per request through Docker's embedded DNS instead of once at startup.
# `docker compose watch` rebuilds ui/sessions on package.json changes, which gives the
# container a new address; a static `upstream` block would keep the old one and
# 502 until the proxy itself restarted. Keep the rest in sync with nginx.conf.
events {
    worker_connections 1024;
}

http {
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Next.js Frontend Routing
        location / {
            # $request_uri is required: a variable proxy_pass does not pass the
            # original URI on by itself.
            set $madash_frontend ui:3000;
            proxy_pass http://$madash_frontend$request_uri;
            include /etc/nginx/proxy_params.conf;
        }

        # Next.js dev HMR channel (webpack-hmr, or Turbopack's hmr) is a
        # WebSocket; without upgrade headers client bundles load but never hydrate.
        location ~ ^/_next/(webpack-hmr|hmr)$ {
            set $madash_hmr ui:3000;
            proxy_pass http://$madash_hmr$request_uri;
            include /etc/nginx/proxy_params.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # WebSocket Server Routing
        location /ws/ {
            set $madash_websocket sessions:28199;
            proxy_pass http://$madash_websocket$request_uri;
            include /etc/nginx/proxy_params.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
