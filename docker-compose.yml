version: '3.8'

services:
  madash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: madash_ui
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "hive.org:host-gateway"
    networks:
      - madash_net
      
  websocket:
    build:
      context: .
      dockerfile: Dockerfile.websocket
    container_name: madash_ws
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - madash_net

  nginx:
    image: nginx:1.25-alpine
    container_name: madash_proxy
    restart: unless-stopped
    ports:
      - "127.0.0.2:80:80"
      - "127.0.0.2:443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - madash
      - websocket
    networks:
      - madash_net

networks:
  madash_net:
    driver: bridge
