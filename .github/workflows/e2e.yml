name: E2E Tests

on:
  workflow_dispatch:
  # Master only. Runs against the persistent shared Hive (see
  # System-B90/.github CLAUDE.md, "Shared persistent Hive"): one job at a time
  # across the org, 25 minutes each, so keep this suite small and
  # non-destructive. Use workflow_dispatch to run it against a branch.
  push:
    branches: [master]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  # shared-hive-acquire cancels this run if it holds Hive past 25 minutes.
  actions: write

jobs:
  e2e:
    name: E2E Tests (shared Hive)
    runs-on: [self-hosted, shared-hive]
    # Build (before the lock) + queueing for the lock + the 25m Hive budget.
    # The budget itself is enforced by shared-hive-acquire.
    timeout-minutes: 75
    env:
      NPM_TOKEN: ${{ secrets.ACCESS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ── Everything slow happens before taking the shared Hive ─────────
      # The shared-hive runners' system Python is externally managed (PEP 668).
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      # ── Madash environment & local stack ──────────────────────────────
      - name: Generate self-signed SSL certificates
        run: |
          mkdir -p ssl
          openssl req -x509 -newkey rsa:4096 -keyout ssl/key.pem \
            -out ssl/cert.pem -sha256 -days 30 -nodes -subj "/CN=madash.dev"

      - name: Set up Node + Playwright
        uses: System-B90/.github/actions/setup-playwright@main
        with:
          node-version: "22"

      # NEXT_PUBLIC_* values are inlined at build time and are fixed, so the
      # build needs no Hive. SSO credentials are generated after acquiring it.
      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_HIVE_URL: https://hive.org
          NEXT_PUBLIC_WEBSOCKET_SESSION_SERVER_HOST: madash.dev
          NEXT_PUBLIC_WEBSOCKET_SESSION_SERVER_PORT: "443"

      # ── Shared Hive: exclusive, reset, 25-minute budget ──────────────
      - name: Acquire shared Hive
        uses: System-B90/.github/actions/shared-hive-acquire@main

      - name: Register SSO and generate .env
        run: python scripts/ci_setup.py

      # `npm run session:start`/`next start` are plain host processes, not
      # docker-composed — they don't auto-load `.env` the way `next build`
      # does. Promote every generated var to the job environment so later
      # steps (including the session server, which hard-asserts on
      # WEBSOCKET_SESSION_SERVER_SENDER_AUTH_KEY) actually see it.
      - name: Export generated .env into the job environment
        run: |
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" == \#* ]] && continue
            echo "$key=$value" >> "$GITHUB_ENV"
          done < .env

      - name: Start WebSocket session server
        run: npm run session:start &

      - name: Start Next.js server
        run: npm run start &

      # Kept off :80/:443 so it can never contend with Hive's nginx.
      - name: Start Nginx proxy
        run: |
          MADASH_PROXY_BIND_IP=127.0.0.8 MADASH_PROXY_HTTP_PORT=8080 MADASH_PROXY_HTTPS_PORT=8443 \
            docker compose -f deploy/docker-compose.local.yml up proxy -d

      - name: Wait for Madash to be ready
        run: |
          for i in $(seq 1 60); do
            code=$(curl -ks -o /dev/null -w "%{http_code}" https://madash.dev:8443/ || true)
            if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
              echo "Madash is up (HTTP $code)"
              exit 0
            fi
            echo "Attempt $i/60 - Madash not ready yet (HTTP $code), waiting 5s..."
            sleep 5
          done
          echo "::error::Madash failed to become ready in time"
          exit 1

      # ── Run Playwright tests ──────────────────────────────────────────
      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          CI: true
          BASE_URL: https://madash.dev:8443

      - name: Dump Container Logs
        if: failure()
        run: |
          mkdir -p container-logs
          for c in $(docker ps -aq --filter "name=^/madash-") $(docker ps -aq --filter "name=^/hive-core$"); do
            name=$(docker inspect --format '{{.Name}}' "$c" | tr -d '/')
            docker logs "$c" > "container-logs/$name.log" 2>&1 || true
          done
          # Dump proxy logs to stdout for quick diagnosis
          echo "::group::Proxy logs"
          docker logs madash-proxy-local || true
          echo "::endgroup::"

      # Stop the app before releasing, so nothing talks to Hive while it is
      # reset. Only this app's stack — never prune here: the shared Hive's
      # containers are briefly stopped during a reset and a container prune
      # would delete them.
      - name: Stop Madash
        if: always()
        # The host Next/session processes are reaped by the runner at job end;
        # no pkill — other jobs on this host run as the same user.
        run: docker compose -f deploy/docker-compose.local.yml down -v --remove-orphans || true

      - name: Release shared Hive
        if: always()
        uses: System-B90/.github/actions/shared-hive-release@main

      # ── Artifacts ──────────────────────────────────────────────────────
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Results
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Upload Container Logs
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: container-logs
          path: container-logs/
          retention-days: 7
