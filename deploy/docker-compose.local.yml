name: madash

services:
  proxy:
    image: ghcr.io/system-b90/madash/proxy:${MADASH_VERSION:-latest}
    container_name: madash-proxy-local
    restart: unless-stopped
    build:
      context: ../nginx
      dockerfile: Dockerfile.proxy
    ports:
      - "${MADASH_PROXY_BIND_IP:-0.0.0.0}:${MADASH_PROXY_HTTP_PORT:-80}:80"
      - "${MADASH_PROXY_BIND_IP:-0.0.0.0}:${MADASH_PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ../ssl:/etc/nginx/ssl:ro
      - ../nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
    networks:
      - madash_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  madash_net:
    driver: bridge
